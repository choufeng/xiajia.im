name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 配置了 CONVEX_DEPLOY_KEY secret 时：先部署 Convex 函数，并用其 deployment URL
      # 构建前端（npx convex deploy 会把 URL 写入 VITE_CONVEX_URL 再执行 --cmd）；
      # 未配置时退回纯前端构建（页面同步入口显示"未启用后端"）。
      # 注意：GitHub Actions 不允许在 step 的 if 里引用 secrets 上下文，故用 bash 分支。
      - name: Build (with Convex backend if configured)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -n "$CONVEX_DEPLOY_KEY" ]; then
            npx convex deploy --cmd "npm run build" --cmd-url-env-var-name VITE_CONVEX_URL
          else
            npm run build
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
